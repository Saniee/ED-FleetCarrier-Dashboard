name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # The admin tests create a throwaway database per test (#[sqlx::test]).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ed
          POSTGRES_PASSWORD: ed
          POSTGRES_DB: ed_commander
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ed -d ed_commander"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ed:ed@localhost:5432/ed_commander
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo clippy --all-targets
      - run: cargo test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
