services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # loopback only — reachable by native `cargo run`, never externally.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    profiles: ["prod"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TOKEN: ${TOKEN:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-1}
      RATE_LIMIT: ${RATE_LIMIT:-1}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        # without the healthcheck, `depends_on` is effectively a no-op
        condition: service_healthy
    restart: unless-stopped

  frontend:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      ORIGIN: ${PUBLIC_ORIGIN}   # adapter-node needs this behind a proxy
      PORT: "3000"
      HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
